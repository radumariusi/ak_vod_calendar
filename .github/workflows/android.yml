name: Android

on:
  pull_request:
  push:
    branches: [main]
  # Manual run: builds the debug APK and attaches it to the run as an artifact.
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests
        run: ./gradlew :core:test --stacktrace

      - name: Build debug APK
        env:
          # Optional repo secret; without it, the key is typed in the app's Settings.
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          OMDB_API_KEY: ${{ secrets.OMDB_API_KEY }}
        run: ./gradlew :app:assembleDebug --stacktrace

      - name: Upload debug APK
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: ak-vod-calendar-debug
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14
